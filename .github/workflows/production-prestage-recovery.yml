name: Production prestage recovery
run-name: Recover stale production prestage helper

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codesamplex-production-prestage
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: codesamplex-production
    steps:
      - name: Install pinned production SSH material
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CSX_PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CSX_PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/csx-production-ssh"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/csx-production-ssh/id"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/csx-production-ssh/known_hosts"
      - name: Stop only stale prestage helper containers
        shell: bash
        env:
          PRODUCTION_HOST: ${{ vars.CSX_PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ vars.CSX_PRODUCTION_USER }}
        run: |
          set -euo pipefail
          user="${PRODUCTION_USER:-ubuntu}"
          ssh -i "$RUNNER_TEMP/csx-production-ssh/id" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/csx-production-ssh/known_hosts" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$user@$PRODUCTION_HOST" 'sh -s' <<'REMOTE'
          set -eu
          matches=""
          for id in $(docker ps -q); do
            if docker inspect "$id" --format '{{range .Mounts}}{{if eq .Source "/tmp/csx-server-prestage"}}MATCH{{end}}{{end}}' | grep -q MATCH; then
              matches="$matches $id"
            fi
          done
          echo "matched stale prestage helpers:${matches:- none}"
          for id in $matches; do
            echo "stopping helper $id"
            docker stop -t 10 "$id"
          done
          REMOTE
      - name: Verify helper is gone and production process was not restarted
        shell: bash
        env:
          PRODUCTION_HOST: ${{ vars.CSX_PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ vars.CSX_PRODUCTION_USER }}
        run: |
          set -euo pipefail
          user="${PRODUCTION_USER:-ubuntu}"
          ssh -i "$RUNNER_TEMP/csx-production-ssh/id" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/csx-production-ssh/known_hosts" \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$user@$PRODUCTION_HOST" 'sh -s' <<'REMOTE'
          set -eu
          for id in $(docker ps -q); do
            if docker inspect "$id" --format '{{range .Mounts}}{{if eq .Source "/tmp/csx-server-prestage"}}MATCH{{end}}{{end}}' | grep -q MATCH; then
              echo "stale prestage helper still running: $id" >&2
              exit 1
            fi
          done
          rm -f /tmp/csx-server-prestage
          cd /opt/codesamplex/deploy
          docker compose exec -T server wget -qO- http://127.0.0.1:8080/version
          REMOTE

      - name: Remove production SSH material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/csx-production-ssh/id" "$RUNNER_TEMP/csx-production-ssh/known_hosts"
          rmdir "$RUNNER_TEMP/csx-production-ssh" 2>/dev/null || true
