# Replay Registry metadata for an existing tag without re-running Release.
# The committed server.json is a template; Release normally fills its version,
# MCPB URL and digest from the build before publishing it.
name: Registry metadata

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: registry-metadata-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  registry:
    name: Publish Registry metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Existing GitHub OIDC identity for the MCP Registry
    steps:
      - name: Require an existing version tag
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::expected a v* version tag'; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.ref' | grep -Fx "refs/tags/${TAG}"

      - name: Require a public GitHub release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # An authenticated gh release download can read draft assets. Require
          # the tag to resolve through the unauthenticated public API first.
          URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}"
          if ! curl -q -fsS --max-time 30 --output /dev/null \
            --header 'Accept: application/vnd.github+json' "$URL"; then
            echo '::error::tag has no publicly available GitHub release'
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Fill the tagged server.json from the published checksum metadata
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern codesamplex-mcp.mcpb.sha256 --output mcpb.sha256
          mapfile -t CHECKSUM_LINES < mcpb.sha256
          [[ "${#CHECKSUM_LINES[@]}" -eq 1 ]] || { echo '::error::invalid MCPB checksum metadata'; exit 1; }
          read -r SHA FILE EXTRA <<< "${CHECKSUM_LINES[0]}"
          [[ "$SHA" =~ ^[0-9a-f]{64}$ && "$FILE" = codesamplex-mcp.mcpb && -z "$EXTRA" ]] \
            || { echo '::error::invalid MCPB checksum metadata'; exit 1; }
          VERSION="${TAG#v}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/codesamplex-mcp.mcpb"
          jq --arg v "$VERSION" --arg url "$URL" --arg sha "$SHA" '
            .version = $v
            | .packages[0].version = $v
            | .packages[0].identifier = $url
            | .packages[0].fileSha256 = $sha
          ' server.json > server.tmp
          mv server.tmp server.json

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          PUBLISHER_VERSION=v1.8.1
          curl -fsSL -o /tmp/mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  /tmp/mcp-publisher.tar.gz' \
            | sha256sum -c -
          tar xzf /tmp/mcp-publisher.tar.gz mcp-publisher

      - name: Publish to the MCP Registry
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
