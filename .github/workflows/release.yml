# Everything v0.1.0 needed by hand: cross-compile, checksum, bundle,
# release, and publish to the MCP Registry. Doing it manually cost a wrong
# ldflag path (the binaries shipped reporting "dev (git)") and a server.json
# description over the registry's 100-character limit — both the kind of
# mistake a pipeline does not repeat.
#
# The version comes from the tag, so nothing has to be edited in two places.
#
# A normal release is unattended. No step here waits for a human: creating a
# `v*` tag is the decision, and everything after it either completes or fails
# closed. workflow_dispatch exists only to replay a dropped GitHub tag event;
# the first job rejects every ref that is not itself a v* tag. What used to be
# a required reviewer on the signing environment is
# now machine checks a person could not have performed anyway — the monotonic
# release guard, the three-way trust-root agreement, the artifact-to-build
# binding, and the exact published asset set.
#
# The signing seed is why this file has four ubuntu jobs instead of one.
# `build` runs the repository's own test code and a bundler over the built
# binaries; `publish` runs a binary downloaded from another project and holds
# a write-scoped token. Neither has any business sharing a runner with the
# updater signing key, so `sign` sits alone in the protected environment with
# nothing but the seed, the artifact and `contents: read`.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Serialize publication so each job's monotonic guard observes the release
# created by the preceding tag job before deciding whether it may be latest.
concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  release-ref:
    name: Validate release tag ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require an immutable v* tag ref
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::error::release replay requires a v* tag ref"; exit 1 ;;
          esac

  windows-test:
    needs: release-ref
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      # Keep repository fixtures byte-identical to Linux. Several contracts
      # intentionally freeze schema/document hashes and compose structure;
      # Git's Windows CRLF conversion changes those inputs before Go sees
      # them and produces unrelated failures.
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Native Windows launcher and updater tests
        # An explicit ceiling, because the default one was already being
        # grazed. `go test` gives each package binary ten minutes, and on a
        # PASSING run of this job (v0.1.102) internal/sandbox took 471s and
        # internal/evidence 256s -- sandbox at 78% of the limit with nothing
        # wrong. The next runner was a little slower and both hit 600s:
        #
        #   panic: test timed out after 10m0s
        #   FAIL  internal/evidence   600.987s
        #   FAIL  internal/sandbox    601.192s
        #
        # That failed a release for a reason that had nothing to do with the
        # code in it. The ceiling is for a hung test, not a slow runner; set
        # it where only a hang can reach it.
        run: go test -timeout 30m ./...

  # Everything that needs no credential. This job executes the repository's
  # own test code and bundles the built binaries; it is deliberately the one
  # job with no environment and no write scope, so none of that runs beside
  # the signing seed.
  build:
    needs: windows-test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      public_key: ${{ steps.trust_root.outputs.public_key }}
      mcpb_sha256: ${{ steps.mcpb.outputs.sha256 }}
      checksums_sha256: ${{ steps.checksums.outputs.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # A tagged release that fails its own tests is worse than no release.
      - name: Test
        run: go test ./... && go vet ./...

      - name: Version from tag
        id: v
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Refuse a backfilled latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          LATEST=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [ -n "$LATEST" ]; then
            go run ./scripts/update_manifest.go guard "$TAG" "$LATEST"
          else
            go run ./scripts/update_manifest.go guard "$TAG" "$TAG"
          fi

      # The updater trust root is stamped into the binaries at compile time,
      # and this job must never see the seed it belongs to. So the public half
      # is committed: a trust root that exists only as a settings value cannot
      # be reviewed in a diff, and editing this file cannot change what ships
      # — the signing job refuses to sign unless the seed it holds derives
      # exactly this key.
      - name: Read the pinned updater trust root
        id: trust_root
        run: |
          PUB=$(tr -d '[:space:]' < .github/updater-public-key.b64)
          test "$(printf '%s' "$PUB" | base64 -d | wc -c | tr -dc '0-9')" = 32
          echo "public_key=$PUB" >> "$GITHUB_OUTPUT"

      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
          # This exact path is why v0.1.0 first shipped reporting "dev (git)":
          # -X takes the fully qualified variable, not a bare name.
          LDFLAGS: -s -w -X github.com/r2cuerdame/codesamplex/internal/cli.Version=v${{ steps.v.outputs.version }} -X github.com/r2cuerdame/codesamplex/internal/update.PublicKeyBase64=${{ steps.trust_root.outputs.public_key }}
        run: |
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags="$LDFLAGS" \
              -o "dist/csx-$os-$arch$ext" ./cmd/csx
          done
          for arch in amd64 arm64; do
            # NOT -H=windowsgui. That removes the cmd window an MCP host
            # shows, and v0.1.90 shipped it, but PowerShell 5.1 does not
            # redirect a GUI-subsystem child's stdout: `$v = csx version` came
            # back empty, including install.ps1's own launcher self-test. The
            # launcher hides its own console window instead, which costs
            # nothing -- see hideOwnConsoleWindow.
            GOOS=windows GOARCH=$arch go build -trimpath -ldflags="-s -w" \
              -o "dist/csx-launcher-windows-$arch.exe" ./cmd/csx-launcher
          done
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
            -o dist/csx-server-linux-amd64 ./cmd/csx-server
          (cd dist && sha256sum csx-* > SHA256SUMS.txt)

      - name: Build MCPB bundle
        id: mcpb
        run: echo "sha256=$(python3 scripts/make-mcpb.py '${{ steps.v.outputs.version }}')" >> "$GITHUB_OUTPUT"

      # The registry validates nothing about fileSha256, but MCP clients
      # verify it before installing — a stale digest silently breaks every
      # install while the listing still looks healthy.
      - name: Point server.json at this release
        run: |
          V='${{ steps.v.outputs.version }}'
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${V}/codesamplex-mcp.mcpb"
          jq --arg v "$V" --arg url "$URL" --arg sha '${{ steps.mcpb.outputs.sha256 }}' '
            .version = $v
            | .packages[0].version = $v
            | .packages[0].identifier = $url
            | .packages[0].fileSha256 = $sha
          ' server.json > server.tmp && mv server.tmp server.json
          # Fail loudly rather than publish a listing that clients reject.
          test "$(jq -r '.description | length' server.json)" -le 100

      # Splitting the pipeline means the signing job no longer signs what it
      # just built — it signs what it downloaded. This digest travels as a job
      # output rather than inside the artifact, so substituting the artifact
      # cannot also substitute the value it is checked against.
      - name: Bind the artifact to this build
        id: checksums
        run: echo "sha256=$(sha256sum dist/SHA256SUMS.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: |
            dist/
            server.json
          if-no-files-found: error
          retention-days: 7

  # Ask Defender what it thinks of the artifact about to be published.
  #
  # scripts/defender-release-check.ps1 has existed since 2026-08-26 and
  # docs/operations.md listed this mitigation as done. Nothing invoked it. It
  # was a script a person had to remember to run, and on 2026-09-01 nobody
  # did: v0.1.89 published a Windows payload that current definitions
  # quarantine, and the first anyone knew was a user who could not install.
  #
  # Deliberately NOT a gate. The verdict is a machine-learning output and it
  # is dated -- the same bytes have scanned clean and been quarantined on
  # consecutive definition builds, which is the substance of the false-positive
  # report filed as 3e13330b-dcee-4708-9436-f59a5dca3399. A blocking check
  # would have held every release on the day the shipped payload was flagged.
  # The value is knowing before deploying, not refusing to ship.
  defender-scan:
    needs: build
    permissions:
      contents: read
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-dist
      - name: Scan the Windows release binaries
        id: scan
        continue-on-error: true
        shell: pwsh
        run: |
          $files = @(
            'dist/csx-windows-amd64.exe'
            'dist/csx-windows-arm64.exe'
            'dist/csx-launcher-windows-amd64.exe'
            'dist/csx-launcher-windows-arm64.exe'
          )
          # -DisableRemediation lives inside the script: asking must not be
          # able to quarantine the artifact being asked about.
          ./scripts/defender-release-check.ps1 -Path $files
          exit $LASTEXITCODE
      - name: Say what it found, where a person will see it
        if: always()
        shell: pwsh
        run: |
          $verdict = if ($env:SCAN_OUTCOME -eq 'success') {
            'CLEAN against the definitions on this runner today.'
          } else {
            'FLAGGED, or could not be measured. A published release may be unusable for new Windows installs.'
          }
          "## Defender pre-release scan`n`n$verdict`n`nRead narrowly: a static scan at one definition build. See docs/operations.md." |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}

  # The only job that can reach the updater signing seed. It holds no write
  # scope, publishes nothing, and runs no code from outside this repository —
  # it exists to turn a set of digests into one signature and then stop.
  sign:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment: codesamplex-release-signing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-dist
          path: .

      - name: Confirm the artifact is the one this run built
        env:
          EXPECTED_CHECKSUMS_SHA256: ${{ needs.build.outputs.checksums_sha256 }}
        run: |
          test -n "$EXPECTED_CHECKSUMS_SHA256"
          echo "${EXPECTED_CHECKSUMS_SHA256}  dist/SHA256SUMS.txt" | sha256sum -c -
          (cd dist && sha256sum -c SHA256SUMS.txt)

      # Three values must agree before anything is signed: the key derived
      # from the seed in this environment, the key pinned as the environment
      # variable, and the key the build job actually stamped into the six
      # client binaries. Any disagreement is an unplanned trust-root rotation
      # that would strand every installed client, so it stops the release here
      # — before a GitHub release exists and before the registry is told.
      - name: Derive updater trust root
        env:
          CSX_UPDATE_SIGNING_KEY_B64: ${{ secrets.CSX_UPDATE_SIGNING_KEY_B64 }}
          EXPECTED_UPDATE_PUBLIC_KEY_B64: ${{ vars.CSX_UPDATE_PUBLIC_KEY_B64 }}
          STAMPED_UPDATE_PUBLIC_KEY_B64: ${{ needs.build.outputs.public_key }}
        run: |
          PUB=$(go run ./scripts/update_manifest.go public)
          test -n "$EXPECTED_UPDATE_PUBLIC_KEY_B64"
          test "$PUB" = "$EXPECTED_UPDATE_PUBLIC_KEY_B64"
          test -n "$STAMPED_UPDATE_PUBLIC_KEY_B64"
          test "$PUB" = "$STAMPED_UPDATE_PUBLIC_KEY_B64"

      - name: Sign stable updater manifest
        env:
          CSX_UPDATE_SIGNING_KEY_B64: ${{ secrets.CSX_UPDATE_SIGNING_KEY_B64 }}
        run: go run ./scripts/update_manifest.go sign "${GITHUB_REF#refs/tags/}" "${GITHUB_RUN_ID}" dist dist/csx-update-stable.json

      - name: Verify signed updater manifest
        run: go run ./scripts/update_manifest.go verify '${{ needs.build.outputs.public_key }}' dist/csx-update-stable.json "${GITHUB_REF#refs/tags/}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest
          path: dist/csx-update-stable.json
          if-no-files-found: error
          retention-days: 7

  # Write scope and the registry's OIDC identity live here, and the signing
  # seed does not. This job can replace a release asset; it cannot mint a
  # signature, so the worst it can publish is something the updater refuses —
  # which the verification steps below catch before the registry hears of it.
  publish:
    needs: [build, sign]
    permissions:
      contents: write # create the release and upload assets
      id-token: write # OIDC for the MCP Registry — no stored secret
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-dist
          path: .

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-manifest
          path: dist

      - name: Confirm the artifact is the one this run built
        env:
          EXPECTED_CHECKSUMS_SHA256: ${{ needs.build.outputs.checksums_sha256 }}
        run: |
          test -n "$EXPECTED_CHECKSUMS_SHA256"
          echo "${EXPECTED_CHECKSUMS_SHA256}  dist/SHA256SUMS.txt" | sha256sum -c -
          (cd dist && sha256sum -c SHA256SUMS.txt)

      # This job never sees the seed, so this is the same check an updating
      # client performs, run against the exact bytes about to be uploaded.
      - name: Verify the signed updater manifest
        run: go run ./scripts/update_manifest.go verify '${{ needs.build.outputs.public_key }}' dist/csx-update-stable.json "${GITHUB_REF#refs/tags/}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ASSETS=(dist/csx-darwin-amd64 dist/csx-darwin-arm64 \
            dist/csx-linux-amd64 dist/csx-linux-arm64 \
            dist/csx-windows-amd64.exe dist/csx-windows-arm64.exe \
            dist/csx-launcher-windows-amd64.exe dist/csx-launcher-windows-arm64.exe \
            dist/csx-server-linux-amd64 dist/SHA256SUMS.txt dist/csx-update-stable.json \
            dist/codesamplex-mcp.mcpb dist/codesamplex-mcp.mcpb.sha256)
          # A registry publish can fail after the GitHub release exists. Make
          # reruns repair/replace that release's assets instead of failing at
          # `gh release create` and permanently blocking recovery.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TAG" --generate-notes --latest
          fi

      - name: Verify exact published release asset set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          printf '%s\n' \
            csx-darwin-amd64 csx-darwin-arm64 csx-linux-amd64 csx-linux-arm64 \
            csx-windows-amd64.exe csx-windows-arm64.exe \
            csx-launcher-windows-amd64.exe csx-launcher-windows-arm64.exe \
            csx-server-linux-amd64 SHA256SUMS.txt csx-update-stable.json \
            codesamplex-mcp.mcpb codesamplex-mcp.mcpb.sha256 | sort > /tmp/expected-assets
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '.assets[].name' | sort > /tmp/actual-assets
          diff -u /tmp/expected-assets /tmp/actual-assets

      # The asset must exist and match before the registry is told about it;
      # publishing first would advertise a digest nobody can satisfy.
      - name: Verify the published asset
        run: |
          curl -fsSL -o /tmp/bundle.mcpb \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${{ needs.build.outputs.version }}/codesamplex-mcp.mcpb"
          echo '${{ needs.build.outputs.mcpb_sha256 }}  /tmp/bundle.mcpb' | sha256sum -c -
          curl -fsSL -o /tmp/csx-update-stable.json \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${{ needs.build.outputs.version }}/csx-update-stable.json"
          go run ./scripts/update_manifest.go verify \
            '${{ needs.build.outputs.public_key }}' /tmp/csx-update-stable.json \
            "v${{ needs.build.outputs.version }}"

      - name: Install mcp-publisher
        run: |
          PUBLISHER_VERSION=v1.8.1
          curl -fsSL -o /tmp/mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  /tmp/mcp-publisher.tar.gz' \
            | sha256sum -c -
          tar xzf /tmp/mcp-publisher.tar.gz mcp-publisher

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  # The farm is part of this release, not something that finds out about it
  # later. Its nodes still self-converge, but that is recovery rather than
  # release evidence: a rollout nobody watched cannot drain a worker before it
  # swaps, cannot canary one before the rest, and cannot tell this workflow
  # that a target never came back. A green Release run therefore means this
  # job observed the farm reach the exact release; production relies on that
  # meaning before it starts the server half of a dual-binary change.
  #
  # Deliberately a separate job. The updater signing seed lives in the sign
  # job's protected environment; a token that can start a workflow in another
  # repository has no business sharing a process with it.
  #
  # workflow_dispatch, not repository_dispatch, and the difference is the whole
  # security argument. The repository_dispatch endpoint requires Contents:write
  # on the target — and the farm repo's workflows run on self-hosted runners
  # that sit on the farm nodes, so write access to that repository is arbitrary
  # code execution as root on every node in the fleet. This secret lives in a
  # PUBLIC repository at repository scope, where no environment protection
  # gates it. Contents:write there would have been the single worst credential
  # in the system. Dispatching an existing workflow on an existing ref needs
  # only Actions:write, which cannot introduce code.
  farm:
    name: Roll the farm
    needs: publish
    runs-on: ubuntu-latest
    # Nothing in this repository. The dispatch authenticates as the farm token;
    # GITHUB_TOKEN is not used here and is given nothing.
    permissions: {}
    # Must exceed the farm's own budget (its linux job caps at 25 minutes) plus
    # the time a job can sit queued for a self-hosted runner. A watcher that
    # gives up first reports a healthy rollout as a failed release and then
    # abandons it mid-flight.
    timeout-minutes: 60
    steps:
      - name: Dispatch the release to the farm
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.CSX_FARM_DISPATCH_TOKEN }}
          FARM_REPO: r2cuerdame/CodeSampleX-Farm
        run: |
          set +e
          TAG="${GITHUB_REF#refs/tags/}"
          # Self-convergence is not ordered evidence. Without the dispatch token
          # this workflow cannot prove the verifier fleet reached the client
          # before a production server deploy, so the release must fail closed.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::CSX_FARM_DISPATCH_TOKEN is required; refusing a green release without verified farm rollout evidence for $TAG."
            exit 1
          fi
          # A farm with no runner online cannot roll out, and the wait below
          # would sit against a queued run until this job times out — an hour of
          # nothing, then a red release. Say so in seconds instead. This is
          # still a failure: §8.4 wants an unreachable target to be visible.
          #
          # Listing self-hosted runners needs repo Administration:read, which
          # this token deliberately does NOT carry — Actions:write being its
          # only scope is the whole security argument above. So a probe that
          # cannot answer is "unknown", never "zero": dispatch anyway and let
          # the rollout watch below report a farm that never starts. Treating
          # the 403 as zero failed every release the moment the token was
          # scoped correctly.
          ONLINE=$(gh api "repos/${FARM_REPO}/actions/runners" \
            --jq '[.runners[] | select(.status == "online" and ([.labels[].name] | index("csx-farm")))] | length' 2>/dev/null)
          if [ $? -ne 0 ] || [ -z "$ONLINE" ]; then
            echo "::notice::cannot list ${FARM_REPO} runners with this token; dispatching and relying on the rollout watch."
            ONLINE=unknown
          fi
          if [ "$ONLINE" = "0" ]; then
            {
              echo "### Farm: DEGRADED — no farm runner is online"
              echo ""
              echo "The release published successfully. No farm node was reachable to roll"
              echo "it out, so the fleet is still on the previous version. Each node will"
              echo "converge on its own within ten minutes of coming back."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::no online csx-farm runner; the farm was not rolled out"
            exit 1
          fi
          # Record what the farm had already run, so the wait can tell this
          # rollout apart from the previous one.
          BEFORE=$(gh run list --repo "$FARM_REPO" --workflow deploy.yml \
            --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          echo "before=${BEFORE:-0}" >> "$GITHUB_OUTPUT"
          # --input with real JSON: inputs is a nested object, and building it
          # out of -f flags is the kind of quoting that works until it does not.
          jq -n --arg tag "$TAG" '{
            ref: "main",
            inputs: { release: $tag, csx_version: ($tag | ltrimstr("v")) }
          }' | gh api -X POST "repos/${FARM_REPO}/actions/workflows/deploy.yml/dispatches" --input -
          if [ $? -ne 0 ]; then
            echo "::error::could not dispatch the farm rollout"
            exit 1
          fi

      - name: Wait for the farm to report
        env:
          GH_TOKEN: ${{ secrets.CSX_FARM_DISPATCH_TOKEN }}
          FARM_REPO: r2cuerdame/CodeSampleX-Farm
          BEFORE: ${{ steps.dispatch.outputs.before }}
        run: |
          set +e
          TAG="${GITHUB_REF#refs/tags/}"
          # A dispatch does not hand back a run id. Match both a newer database
          # id and the Farm workflow's immutable `farm -> <tag>` display title;
          # an unrelated manual rollout must not satisfy this release.
          RUN=0
          for _ in $(seq 1 30); do
            sleep 10
            RUN=$(gh run list --repo "$FARM_REPO" --workflow deploy.yml \
              --limit 20 --json databaseId,displayTitle | \
              jq -r --arg title "farm -> $TAG" --argjson before "${BEFORE:-0}" \
                '[.[] | select(.databaseId > $before and .displayTitle == $title)][0].databaseId // 0')
            if [ "$RUN" != "0" ]; then break; fi
            RUN=0
          done
          if [ "$RUN" = 0 ]; then
            echo "::error::the farm never started a rollout for this release"
            exit 1
          fi
          echo "Watching ${FARM_REPO} run ${RUN} for ${TAG}"
          # Poll for the conclusion rather than `gh run watch`. The farm repo is
          # private and this repository's logs are world-readable; streaming its
          # job names, step names and failure annotations in here would publish
          # them. A status word is all this job needs.
          STATUS=""
          CONCLUSION=""
          for _ in $(seq 1 180); do
            read -r STATUS CONCLUSION <<<"$(gh run view "$RUN" --repo "$FARM_REPO" \
              --json status,conclusion --jq '"\(.status) \(.conclusion // "")"')"
            [ "$STATUS" = "completed" ] && break
            sleep 15
          done
          if [ "$CONCLUSION" = "success" ]; then
            echo "### Farm: rolled out and healthy" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Farm: DEGRADED"
            echo ""
            echo "The release itself published successfully — binaries, updater manifest"
            echo "and registry listing are all live. What failed is the farm rollout:"
            echo "at least one target did not reach this release."
            echo ""
            echo "Rollout status: \`${STATUS:-unknown}\` / \`${CONCLUSION:-none}\`"
            echo "https://github.com/${FARM_REPO}/actions/runs/${RUN}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::farm rollout ${CONCLUSION:-did not complete}"
          exit 1
