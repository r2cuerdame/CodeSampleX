name: Builder freshness
run-name: Check that the public stats clock is under a day old

# #517: production served stats generatedAt=2026-09-17T12:34:46Z for more than
# eight days and no check noticed, because none looked at the clock itself.
# One public GET a day; the run fails when the stamp is older than 24 hours,
# and its log carries the builder's own last-failure reason from /v1/builder.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    name: Stats generatedAt age
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Judge the production stats clock
        run: python3 -I -B scripts/stats-freshness.py --base-url https://codesamplex.dev
