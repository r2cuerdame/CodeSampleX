# The merge gate. Until now the only automated test run happened at tag time,
# in release.yml — after the code was already on main and being released.
#
# The specific hole this closes: every PostgreSQL test in internal/serverstore
# skips itself when CSX_TEST_DSN is unset, and nothing in CI ever set it. The
# guard added for the /wanted outage (R2C-55) asserts the query plan's
# complexity class, which is the one property a Fake store cannot check — so it
# needs a real PostgreSQL or it proves nothing. It sat green and unexecuted.
#
# Skipped and passed are the same colour in a summary, so this workflow does not
# trust the exit code alone: it reads the machine-readable run and refuses to
# pass while any test in that package skipped.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A superseded push has nothing to say about the branch's current head, but
# main's runs are the record of what was merged and are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Disposable, job-scoped, and reachable only from this job's network: the
    # credentials below are the whole database, created and destroyed with the
    # runner. Production's DSN is not a secret this workflow needs, and giving
    # it one would make a test capable of touching the live corpus.
    #
    # 17-alpine is what deploy/docker-compose.yml runs. A plan-shape assertion
    # is only evidence about production if the planner is production's.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: csx
          POSTGRES_PASSWORD: csx-ci-throwaway
          POSTGRES_DB: csx
        ports:
          - 5432:5432
        # No step runs until this answers, so a database that never comes up
        # fails during "Initialize containers" instead of inside a test.
        options: >-
          --health-cmd "pg_isready -U csx -d csx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CSX_TEST_DSN: postgres://csx:csx-ci-throwaway@127.0.0.1:5432/csx?sslmode=disable
      # Turns a lost DSN into a failure that names the variable, instead of 30
      # silent skips. See integrationDSN in internal/serverstore.
      CSX_REQUIRE_TEST_DSN: "1"

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      # Everything that needs no database, first: a compile error or a broken
      # unit test should not wait on the PostgreSQL suite to be reported.
      - name: Unit and contract tests
        run: |
          set -euo pipefail
          pkgs="$(go list ./... | grep -v '^github.com/r2cuerdame/codesamplex/internal/serverstore$')"
          test -n "$pkgs"
          go test $pkgs -count=1

      # A database that is up but wrong — bad credentials, a migration that no
      # longer applies, a schema the search_path cannot see — fails here, under
      # a step whose name says the database was not ready. The next step is
      # then only ever about the code.
      - name: Database preflight
        run: go test ./internal/serverstore/ -run '^TestIntegrationDatabaseIsReadyForTheSuite$' -count=1 -v

      - name: PostgreSQL integration tests
        run: |
          set -euo pipefail
          # The renderer below is the only readable form of a -json run, so the
          # failing case must reach it rather than abort the step at `go test`.
          status=0
          go test ./internal/serverstore/ -count=1 -json > "$RUNNER_TEMP/pg-tests.json" || status=$?
          # -json implies verbose, so this is the whole run in order: which
          # test, which assertion, which migration or query it died on.
          jq -j 'select(.Action == "output") | .Output' "$RUNNER_TEMP/pg-tests.json"
          if [ "$status" -ne 0 ]; then
            jq -r 'select(.Action == "fail" and (.Test // "") != "") | "::error::failed: " + .Test' "$RUNNER_TEMP/pg-tests.json"
            exit "$status"
          fi

      # The completion condition of R2C-57, asserted rather than assumed. A
      # green exit code above is also what a run of nothing but skips produces.
      - name: Prove the PostgreSQL tests actually ran
        run: |
          set -euo pipefail
          ran="$(jq -r 'select(.Action == "pass" and ((.Test // "") | startswith("TestIntegration"))) | .Test' "$RUNNER_TEMP/pg-tests.json" | sort -u)"
          skipped="$(jq -r 'select(.Action == "skip" and (.Test // "") != "") | .Test' "$RUNNER_TEMP/pg-tests.json" | sort -u)"

          # An empty reading means the measurement broke, not that the suite is
          # clean — the one failure mode this check must never report as a pass.
          if [ -z "$ran" ]; then
            echo "::error::no TestIntegration result was recorded; the proof itself is broken, not the suite"
            exit 1
          fi
          if [ -n "$skipped" ]; then
            echo "::error::a PostgreSQL test skipped, so this run proved nothing about it"
            printf '%s\n' "$skipped" | sed 's/^/  skipped: /'
            exit 1
          fi
          # Named because it is why this gate exists: the /wanted outage guard.
          if ! printf '%s\n' "$ran" | grep -qx 'TestIntegrationListWantedExpandsTheCorpusOncePerRequest'; then
            echo "::error::the /wanted complexity guard (R2C-55) did not run"
            exit 1
          fi

          {
            echo "### PostgreSQL integration: $(printf '%s\n' "$ran" | wc -l) tests ran, 0 skipped"
            echo ""
            echo "Against \`postgres:17-alpine\`, each test in its own throwaway schema."
            echo "The /wanted complexity guard from R2C-55 ran and passed."
          } >> "$GITHUB_STEP_SUMMARY"

      # internal/serverstore is no longer the only package that needs a real
      # database. R2C-58's pool guard is asserted end-to-end over HTTP in
      # cmd/csx-server: a lock is taken on the wanted table, more visitors than
      # the read class may hold are sent at the stuck page, and /healthz has to
      # keep answering. Those tests skip themselves without a DSN exactly like
      # the serverstore ones — and they run in the "Unit and contract tests"
      # step above, which is not -json and therefore cannot tell a skip from a
      # pass. Without this step the guard could stop running and CI would stay
      # green, which is the R2C-57 hole reopened one package to the left.
      - name: PostgreSQL end-to-end pool pressure tests
        run: |
          set -euo pipefail
          status=0
          go test ./cmd/csx-server/ -run '^TestIntegration' -count=1 -json > "$RUNNER_TEMP/srv-tests.json" || status=$?
          jq -j 'select(.Action == "output") | .Output' "$RUNNER_TEMP/srv-tests.json"
          if [ "$status" -ne 0 ]; then
            jq -r 'select(.Action == "fail" and (.Test // "") != "") | "::error::failed: " + .Test' "$RUNNER_TEMP/srv-tests.json"
            exit "$status"
          fi

          ran="$(jq -r 'select(.Action == "pass" and ((.Test // "") | startswith("TestIntegration"))) | .Test' "$RUNNER_TEMP/srv-tests.json" | sort -u)"
          skipped="$(jq -r 'select(.Action == "skip" and (.Test // "") != "") | .Test' "$RUNNER_TEMP/srv-tests.json" | sort -u)"
          if [ -z "$ran" ]; then
            echo "::error::no end-to-end pool test result was recorded; the proof itself is broken, not the suite"
            exit 1
          fi
          if [ -n "$skipped" ]; then
            echo "::error::an end-to-end pool test skipped, so this run proved nothing about it"
            printf '%s\n' "$skipped" | sed 's/^/  skipped: /'
            exit 1
          fi
          # Named because it is why this gate exists: with the guard disabled
          # this exact test fails the way production did — /healthz 503 while
          # one page is stuck.
          if ! printf '%s\n' "$ran" | grep -qx 'TestIntegrationOneStuckPageDoesNotTakeTheSiteDown'; then
            echo "::error::the pool starvation guard (R2C-58) did not run"
            exit 1
          fi

          {
            echo "### Pool pressure end-to-end: $(printf '%s\n' "$ran" | wc -l) tests ran, 0 skipped"
            echo ""
            echo "One page held on a table lock; /healthz and an unrelated page stayed up."
          } >> "$GITHUB_STEP_SUMMARY"
