name: R2C-164 review fix

on:
  push:
    branches:
      - r2cuerdame/R2C-164-csx-normal-output-fact-layer-low-advisory

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r2cuerdame/R2C-164-csx-normal-output-fact-layer-low-advisory
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply review fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # 1) Two-phase search so recording happens after relevance filtering.
          replace_once('internal/mcp/tools.go',
          '''\tSearch func(ctx context.Context, req domain.SearchRequest) (resp domain.SearchResponse, offerID string)\n''',
          '''\tSearch func(ctx context.Context, req domain.SearchRequest) (resp domain.SearchResponse, offerID string)\n\t// SearchRaw performs retrieval without recording a hit/offer. toolSearch\n\t// uses this two-phase path so the relevance gate can run before the\n\t// user-visible outcome is recorded.\n\tSearchRaw func(ctx context.Context, req domain.SearchRequest) domain.SearchResponse\n\t// RecordSearchOutcome records only the response that normal output\n\t// actually exposed after relevance filtering.\n\tRecordSearchOutcome func(ctx context.Context, req domain.SearchRequest, resp domain.SearchResponse) string\n''')

          p = Path('internal/mcp/deps.go')
          s = p.read_text(encoding='utf-8')
          marker = '\n\td := &Deps{\n'
          if marker not in s:
              raise SystemExit('deps marker not found')
          closures = '''\n\tsearchRaw := func(ctx context.Context, req domain.SearchRequest) domain.SearchResponse {\n\t\tresp := engine.Search(ctx, req)\n\t\tif resp.Miss {\n\t\t\tlive := currentConfig(home)\n\t\t\tif live.Mode == config.ModeCommunity {\n\t\t\t\tsyncer := &search.Syncer{DB: db, ServerURL: live.ServerURL, HTTP: syncHTTP}\n\t\t\t\tif search.FetchMissing(ctx, engine, syncer, live.Mode, req) {\n\t\t\t\t\tresp = engine.Search(ctx, req)\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t\treturn resp\n\t}\n\trecordSearch := func(ctx context.Context, req domain.SearchRequest, resp domain.SearchResponse) string {\n\t\treturn recordSearchOutcomeReloaded(ctx, db, ident,\n\t\t\tfunc() *config.Config { return currentConfig(home) }, req, resp)\n\t}\n'''
          s = s.replace(marker, closures + marker, 1)
          pattern = re.compile(r'''\t\tSearch: func\(ctx context\.Context, req domain\.SearchRequest\) \(domain\.SearchResponse, string\) \{.*?\n\t\t\},\n\t\tGetSample:''', re.S)
          repl = '''\t\tSearch: func(ctx context.Context, req domain.SearchRequest) (domain.SearchResponse, string) {\n\t\t\tresp := searchRaw(ctx, req)\n\t\t\treturn resp, recordSearch(ctx, req, resp)\n\t\t},\n\t\tSearchRaw:            searchRaw,\n\t\tRecordSearchOutcome: recordSearch,\n\t\tGetSample:'''
          s2, n = pattern.subn(repl, s, count=1)
          if n != 1:
              raise SystemExit(f'deps Search closure replacement count={n}')
          p.write_text(s2, encoding='utf-8')

          replace_once('internal/mcp/tools.go',
          '''\tresp, offerID := s.Deps.Search(ctx, req)\n''',
          '''\tvar (\n\t\tresp    domain.SearchResponse\n\t\tofferID string\n\t)\n\ttwoPhase := s.Deps.SearchRaw != nil && s.Deps.RecordSearchOutcome != nil\n\tif twoPhase {\n\t\tresp = s.Deps.SearchRaw(ctx, req)\n\t} else {\n\t\tresp, offerID = s.Deps.Search(ctx, req)\n\t}\n''')
          replace_once('internal/mcp/tools.go',
          '''\tresp, suppressed := domain.GateNormalOutput(req, resp, nil)\n''',
          '''\tresp, suppressed := domain.GateNormalOutput(req, resp, nil)\n\tif twoPhase {\n\t\tofferID = s.Deps.RecordSearchOutcome(ctx, req, resp)\n\t} else if len(suppressed) > 0 {\n\t\t// Compatibility fakes may still provide only Search. We cannot\n\t\t// safely re-record those, so never expose an offer for a candidate\n\t\t// that the gate may have hidden.\n\t\tofferID = ""\n\t}\n''')

          # 2) Per-result Relevance lines instead of one global explanation.
          replace_once('internal/mcp/tools.go',
          '''\ttext := renderSearchResponse(resp)\n\tif len(resp.Results) > 0 {\n\t\ttext = withRelevance(text, resp.Results[0].RelevanceLine(req, nil))\n\t}\n''',
          '''\trelevance := make([]string, len(resp.Results))\n\tfor i := range resp.Results {\n\t\trelevance[i] = resp.Results[i].RelevanceLine(req, nil)\n\t}\n\ttext := renderSearchResponseWithRelevance(resp, relevance)\n''')
          replace_once('internal/mcp/tools.go',
          '''func renderSearchResponse(resp domain.SearchResponse) string {\n''',
          '''func renderSearchResponse(resp domain.SearchResponse) string {\n\treturn renderSearchResponseWithRelevance(resp, nil)\n}\n\nfunc renderSearchResponseWithRelevance(resp domain.SearchResponse, relevance []string) string {\n''')
          replace_once('internal/mcp/tools.go',
          '''\t\tif why := r.ConfidenceReason(); why != "" {\n\t\t\tb.WriteString(" — " + why)\n\t\t}\n\t\tb.WriteString("\\n\\n")\n''',
          '''\t\tif why := r.ConfidenceReason(); why != "" {\n\t\t\tb.WriteString(" — " + why)\n\t\t}\n\t\tb.WriteString("\\n")\n\t\tif i < len(relevance) && relevance[i] != "" {\n\t\t\tb.WriteString(relevance[i] + "\\n")\n\t\t}\n\t\tb.WriteString("\\n")\n''')
          replace_once('internal/mcp/tools.go',
          '''\t\tText: withRelevance(\n\t\t\tadvisoryDecision(renderSearchResponse(resp), advisory, reason),\n\t\t\ttop.RelevanceLine(req, argv)),\n''',
          '''\t\tText: advisoryDecision(\n\t\t\trenderSearchResponseWithRelevance(resp, []string{top.RelevanceLine(req, argv)}),\n\t\t\tadvisory, reason),\n''')

          # 3) Hook filters the full candidate list before selecting one answer.
          p = Path('internal/cli/hook.go')
          s = p.read_text(encoding='utf-8')
          start = s.index('\t// One answer. This arrives unasked')
          end = s.index('\tclassification, advisoryOnly, reason := resp.Results[0].RecommendationClassification()', start)
          new = '''\t// Filter the full retrieval set before selecting the one hook answer.\n\t// Similarity ranking and fact relevance are different questions: an\n\t// unrelated #1 must not hide a relevant #2.\n\tretrieved := append([]domain.SearchResult(nil), resp.Results...)\n\tresp, _ = domain.GateNormalOutput(req, resp, proj.Argv)\n\tif resp.Miss || len(resp.Results) == 0 {\n\t\tif len(retrieved) > 0 {\n\t\t\tif reason := retrieved[0].SuppressionReason(req, proj.Argv); reason != "" {\n\t\t\t\treturn quiet(reason, hookSuppressionDetail(retrieved[0], reason))\n\t\t\t}\n\t\t}\n\t\tasked, _ := json.Marshal(req)\n\t\treturn quiet(hookTraceNoMatch, "nothing here has been proven for this failure; asked: "+string(asked))\n\t}\n\n\t// One answer. This arrives unasked, in the middle of somebody's work, so\n\t// it earns a few lines and not a list.\n\tif len(resp.Results) > 1 {\n\t\tresp.Results = resp.Results[:1]\n\t}\n'''
          p.write_text(s[:start] + new + s[end:], encoding='utf-8')

          # 4) Recognize a conservative POSIX errno set without accepting arbitrary ALL-CAPS words.
          replace_once('internal/domain/outputrelevance.go',
          '''var diagnosticToken = regexp.MustCompile(`^[A-Z][A-Z0-9]*(?:[0-9_][A-Z0-9_]*)+$`)\n''',
          '''var diagnosticToken = regexp.MustCompile(`^[A-Z][A-Z0-9]*(?:[0-9_][A-Z0-9_]*)+$`)\n\nvar standardErrnoToken = map[string]struct{}{\n\t"EACCES": {}, "EAGAIN": {}, "EBADF": {}, "EBUSY": {}, "ECANCELED": {},\n\t"ECHILD": {}, "ECONNABORTED": {}, "ECONNREFUSED": {}, "ECONNRESET": {},\n\t"EEXIST": {}, "EFAULT": {}, "EINPROGRESS": {}, "EINTR": {}, "EINVAL": {},\n\t"EIO": {}, "EISDIR": {}, "ELOOP": {}, "EMFILE": {}, "ENAMETOOLONG": {},\n\t"ENETDOWN": {}, "ENETRESET": {}, "ENETUNREACH": {}, "ENFILE": {},\n\t"ENOBUFS": {}, "ENODEV": {}, "ENOENT": {}, "ENOEXEC": {}, "ENOMEM": {},\n\t"ENOSPC": {}, "ENOSYS": {}, "ENOTCONN": {}, "ENOTDIR": {}, "ENOTEMPTY": {},\n\t"ENOTSOCK": {}, "ENOTSUP": {}, "ENOTTY": {}, "ENXIO": {}, "EOPNOTSUPP": {},\n\t"EOVERFLOW": {}, "EPERM": {}, "EPIPE": {}, "EPROTO": {},\n\t"EPROTONOSUPPORT": {}, "EPROTOTYPE": {}, "ERANGE": {}, "EROFS": {},\n\t"ESRCH": {}, "ETIMEDOUT": {}, "EWOULDBLOCK": {}, "EXDEV": {},\n}\n\nfunc isDiagnosticToken(token string) bool {\n\tif diagnosticToken.MatchString(token) {\n\t\treturn true\n\t}\n\t_, ok := standardErrnoToken[token]\n\treturn ok\n}\n''')
          replace_once('internal/domain/outputrelevance.go',
          '''\t\tif diagnosticToken.MatchString(field) {\n''',
          '''\t\tif isDiagnosticToken(field) {\n''')

          # Focused review regression tests.
          Path('internal/domain/outputrelevance_review_test.go').write_text(r'''package domain

import "testing"

func TestRequestDiagnosticsRecognizesLetterOnlyErrnos(t *testing.T) {
	for _, code := range []string{"ENOENT", "EACCES", "EPERM"} {
		t.Run(code, func(t *testing.T) {
			got := requestDiagnostics(SearchRequest{Query: "operation failed with " + code})
			for _, v := range got {
				if v == code {
					return
				}
			}
			t.Fatalf("%s not recognized: %#v", code, got)
		})
	}
}

func TestRequestDiagnosticsRejectsGenericAllCapsWords(t *testing.T) {
	for _, word := range []string{"ERROR", "EXACT", "SHA"} {
		t.Run(word, func(t *testing.T) {
			got := requestDiagnostics(SearchRequest{Query: "ordinary prose " + word})
			for _, v := range got {
				if v == word {
					t.Fatalf("generic word %s was promoted to diagnostic: %#v", word, got)
				}
			}
		})
	}
}
''', encoding='utf-8')

          Path('internal/mcp/reviewfix_test.go').write_text(r'''package mcp

import (
	"context"
	"encoding/json"
	"strings"
	"testing"

	"github.com/r2cuerdame/codesamplex/internal/domain"
)

func TestToolSearchRecordsFilteredVisibleTop(t *testing.T) {
	var recorded domain.SearchResponse
	s := &Server{Deps: &Deps{
		SearchRaw: func(context.Context, domain.SearchRequest) domain.SearchResponse {
			return domain.SearchResponse{Results: []domain.SearchResult{
				{SampleID: "hidden", Grade: domain.GradeCompatible, Confidence: "LOW", Case: &domain.Case{Goal: "format integers", Packages: []string{"pkg:golang/github.com/dustin/go-humanize@v1.0.1"}}},
				{SampleID: "visible", Grade: domain.GradeCompatible, Confidence: "LOW", Case: &domain.Case{Goal: "deploy immutable commit", Packages: []string{"pkg:golang/example.com/deploy@v1.0.0"}}},
			}}
		},
		RecordSearchOutcome: func(_ context.Context, _ domain.SearchRequest, resp domain.SearchResponse) string {
			recorded = resp
			return "offer-visible"
		},
		MachineEnv: func(context.Context) domain.EnvironmentFingerprint { return domain.EnvironmentFingerprint{SchemaVersion: 1} },
	}}
	raw, _ := json.Marshal(searchArgs{Query: "deploy immutable commit", Packages: []string{"pkg:golang/example.com/deploy@v1.0.0"}})
	got := s.toolSearch(context.Background(), raw)
	if len(recorded.Results) != 1 || recorded.Results[0].SampleID != "visible" {
		t.Fatalf("recorded wrong filtered response: %#v", recorded.Results)
	}
	structured, ok := got.StructuredContent.(localSearchStructured)
	if !ok || structured.OfferID != "offer-visible" {
		t.Fatalf("offer not tied to visible result: %#v", got.StructuredContent)
	}
}

func TestToolSearchRecordsMissWhenEverythingSuppressed(t *testing.T) {
	var recorded domain.SearchResponse
	s := &Server{Deps: &Deps{
		SearchRaw: func(context.Context, domain.SearchRequest) domain.SearchResponse {
			return domain.SearchResponse{Results: []domain.SearchResult{{SampleID: "hidden", Grade: domain.GradeCompatible, Confidence: "LOW", Case: &domain.Case{Goal: "format integers", Packages: []string{"pkg:golang/github.com/dustin/go-humanize@v1.0.1"}}}}}
		},
		RecordSearchOutcome: func(_ context.Context, _ domain.SearchRequest, resp domain.SearchResponse) string { recorded = resp; return "" },
		MachineEnv: func(context.Context) domain.EnvironmentFingerprint { return domain.EnvironmentFingerprint{SchemaVersion: 1} },
	}}
	raw, _ := json.Marshal(searchArgs{Query: "deploy immutable commit"})
	_ = s.toolSearch(context.Background(), raw)
	if !recorded.Miss || len(recorded.Results) != 0 {
		t.Fatalf("suppressed result recorded as hit: %#v", recorded)
	}
}

func TestRenderSearchResponseExplainsEachSurvivor(t *testing.T) {
	resp := domain.SearchResponse{Results: []domain.SearchResult{{Grade: domain.GradeCompatible, Confidence: "LOW"}, {Grade: domain.GradeReferenceOnly, Confidence: "LOW"}}}
	text := renderSearchResponseWithRelevance(resp, []string{"Relevance: first.", "Relevance: second."})
	alt := strings.Index(text, "--- alternative 2 ---")
	if alt < 0 || !strings.Contains(text[:alt], "Relevance: first.") || !strings.Contains(text[alt:], "Relevance: second.") {
		t.Fatalf("per-result relevance missing:\n%s", text)
	}
}
''', encoding='utf-8')

          Path('internal/cli/hook_reviewfix_test.go').write_text(r'''package cli

import (
	"context"
	"strings"
	"testing"

	"github.com/r2cuerdame/codesamplex/internal/domain"
)

func TestHookFiltersBeforeSelectingOneAnswer(t *testing.T) {
	env, out := hookHarness(t, hookInput(t, "Bash", "go test ./...", "ENOENT"), func(e *hookEnv) {
		e.inspect = func(context.Context, string, [][]string) hookProject {
			return hookProject{Known: true, Stage: domain.StageProjectTest, Argv: []string{"go", "test", "./..."}}
		}
		e.search = func(context.Context, domain.SearchRequest) (domain.SearchResponse, error) {
			return domain.SearchResponse{Results: []domain.SearchResult{
				{SampleID: "sha256:hidden", Grade: domain.GradeCompatible, Confidence: "LOW", Case: &domain.Case{Goal: "format integers", Packages: []string{"pkg:golang/github.com/dustin/go-humanize@v1.0.1"}}},
				{SampleID: "sha256:visible", Grade: domain.GradeReferenceOnly, Confidence: "LOW", Case: &domain.Case{Goal: "handle missing files", Contract: []string{"os.Open reports ENOENT when the path is absent"}}},
			}}, nil
		}
	})
	if code := hookAgentMain(context.Background(), env); code != 0 {
		t.Fatalf("hook exit=%d", code)
	}
	if !strings.Contains(out.String(), "sha256:visible") || strings.Contains(out.String(), "sha256:hidden") {
		t.Fatalf("hook selected wrong candidate: %s", out.String())
	}
}
''', encoding='utf-8')
          PY
          gofmt -w internal/mcp/tools.go internal/mcp/deps.go internal/domain/outputrelevance.go internal/domain/outputrelevance_review_test.go internal/mcp/reviewfix_test.go internal/cli/hook.go internal/cli/hook_reviewfix_test.go
      - name: Test
        run: go test ./...
      - name: Commit fixes and remove helper
        shell: bash
        run: |
          rm .github/workflows/r2c164-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address R2C-164 review findings"
          git push origin HEAD:r2cuerdame/R2C-164-csx-normal-output-fact-layer-low-advisory
