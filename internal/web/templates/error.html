{{define "content"}}
<section class="hero">
  <p class="eyebrow mono">{{.Status}}</p>
  <h1 class="tagline mono">{{if eq .Status 404}}{{.T "error.not_found"}}{{else if eq .Status 504}}{{.T "error.timeout"}}{{else}}{{.T "error.unavailable"}}{{end}}</h1>
  {{if ne .Status 404}}
  <p class="error-notice" style="margin-top: 1rem; color: var(--fg-muted);">{{.T "error.temporary_notice"}}</p>
  <div class="error-actions" style="margin-top: 1.5rem;">
    <button id="error-retry-btn" class="btn btn-secondary" onclick="manualRetry()">{{.T "error.retry"}}</button>
  </div>
  <script>
    (function() {
      // One automatic retry per path per tab, and not before the server's
      // own Retry-After has comfortably passed. A 503 here means the
      // database is saturated; a browser that reloads twice two seconds
      // apart is a third visitor for the same page at the worst moment
      // (#445). The manual button stays for a reader who wants to try now.
      var retryKey = "csx_retry_" + window.location.pathname;
      var maxAutoRetries = 1;
      var baseDelayMs = 6000;
      var jitterMs = 4000;
      var count = parseInt(sessionStorage.getItem(retryKey) || "0", 10);
      window.manualRetry = function() {
        sessionStorage.setItem(retryKey, "0");
        var btn = document.getElementById("error-retry-btn");
        if (btn) { btn.disabled = true; btn.textContent = {{.T "error.retrying"}}; }
        window.location.reload();
      };
      if (count < maxAutoRetries) {
        sessionStorage.setItem(retryKey, (count + 1).toString());
        setTimeout(function() {
          var btn = document.getElementById("error-retry-btn");
          if (btn) { btn.disabled = true; btn.textContent = {{.T "error.retrying"}}; }
          window.location.reload();
        }, baseDelayMs + Math.floor(Math.random() * jitterMs));
      }
    })();
  </script>
  {{end}}
  <p style="margin-top: 1.5rem;"><a href="{{.HomeHref}}">CodeSampleX</a></p>
</section>
{{end}}
