# CodeSampleX host stack (goal.md §14.2): Caddy + csx-server + PostgreSQL.
# Sized for a 2GB Lightsail instance — no Redis/Kafka/K8s, and no build or
# verification runners here: local peers own verification.
name: codesamplex

services:
  caddy:
    # Pin the first stable line with time-based file rolling: privacy-safe
    # logs must rotate even when traffic never reaches the size threshold.
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # "codesamplex.dev, www.codesamplex.dev" in production; ":80" locally.
      CADDY_SITE: ${CADDY_SITE:-:80}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
      - caddy_safe_logs:/var/log/caddy-safe
    depends_on:
      server:
        condition: service_healthy

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    image: codesamplex/csx-server:latest
    restart: unless-stopped
    environment:
      CSX_DSN: postgres://csx:${POSTGRES_PASSWORD:-csx-local-dev}@db:5432/csx?sslmode=disable
      CSX_LISTEN: ":8080"
      CSX_BLOB_DIR: /data/blobs
      CSX_PUBLIC_URL: ${CSX_PUBLIC_URL:-http://localhost}
      CSX_PUBLIC_CHECK: ${CSX_PUBLIC_CHECK:-strict}
      CSX_SNAPSHOT_INTERVAL: ${CSX_SNAPSHOT_INTERVAL:-5m}
      CSX_SNAPSHOT_PASS_TIMEOUT: ${CSX_SNAPSHOT_PASS_TIMEOUT:-}
      CSX_GITHUB_CLIENT_ID: ${CSX_GITHUB_CLIENT_ID:-}
      CSX_GITHUB_CLIENT_SECRET: ${CSX_GITHUB_CLIENT_SECRET:-}
      # SHA-256 of the private dashboard's Basic-auth password. The raw
      # password is never stored on the host or passed to the container.
      CSX_ADMIN_TOKEN_SHA256: ${CSX_ADMIN_TOKEN_SHA256:-}
      # Dedicated 256-bit HMAC key for unlinkable day/month network buckets.
      # Production deploy creates it remotely in the mode-0600 .env file.
      CSX_ACTIVITY_HASH_KEY: ${CSX_ACTIVITY_HASH_KEY:-}
      # Dedicated Caddy log with IPs/headers/query/path IDs removed before
      # disk. Only its separate volume is mounted below, read-only; the
      # historical query-bearing access.log is outside this container.
      CSX_ADMIN_ACCESS_LOG: /var/log/caddy-safe/access-safe.log
      CSX_DIST_DIR: /data/dist
      # The R2C-58 pool ceilings and their way back. Compose reads .env only
      # to expand ${...}, so a variable no service names never reaches the
      # process: without these lines the documented CSX_DB_POOL_GUARD=off
      # rollback is silently a no-op, which is the worst thing a rollback can
      # be. Empty is not a value here — PoolPolicyFromEnv ignores it — so an
      # untouched .env still runs the shipped policy.
      CSX_DB_POOL_GUARD: ${CSX_DB_POOL_GUARD:-}
      CSX_DB_MAX_CONNS: ${CSX_DB_MAX_CONNS:-}
      CSX_DB_PROBE_RESERVE: ${CSX_DB_PROBE_RESERVE:-}
      CSX_DB_READ_CONNS: ${CSX_DB_READ_CONNS:-}
      CSX_DB_WRITE_CONNS: ${CSX_DB_WRITE_CONNS:-}
      CSX_DB_READ_TIMEOUT: ${CSX_DB_READ_TIMEOUT:-}
      CSX_DB_READ_WAIT: ${CSX_DB_READ_WAIT:-}
      CSX_DB_PROBE_TIMEOUT: ${CSX_DB_PROBE_TIMEOUT:-}
      # CSX-453: ClassFarmIngest's own share of the same pool above, not a
      # second pool -- CodeSampleX-Farm's evidence/receipt/job-queue traffic
      # gets its own floor and ceiling instead of sharing CSX_DB_WRITE_CONNS'
      # with authoring, admin, sitemap and the in-process Builder.
      CSX_DB_FARM_CONNS: ${CSX_DB_FARM_CONNS:-}
      CSX_DB_FARM_TIMEOUT: ${CSX_DB_FARM_TIMEOUT:-}
      CSX_DB_FARM_WAIT: ${CSX_DB_FARM_WAIT:-}
      # CSX-451: which topology this process runs. Empty/"inprocess" (the
      # default) keeps the compatibility Builder a goroutine of this
      # process exactly as before; "standalone" turns that goroutine off
      # because the separate `builder` service below owns the aggregation
      # pipeline instead. The one-variable way back to the in-process
      # Builder — see docs/operations.md "Builder runtime topology" — is
      # setting this back to empty (or "inprocess") and recreating both
      # `server` and `builder`.
      CSX_BUILDER_MODE: ${CSX_BUILDER_MODE:-}
      # CSX-454: the resource governor, which pauses the Builder and Farm
      # ingest while interactive readers are being refused or the host is
      # losing CPU to its hypervisor, and resumes both when that clears.
      # Empty (the default) means on. "off" is the documented no-build
      # rollback — see docs/operations.md "The resource governor" — and it
      # only reaches this process because the variable is named here.
      CSX_GOVERNOR_ENABLED: ${CSX_GOVERNOR_ENABLED:-}
      # The ceiling the Go runtime is otherwise not told about.
      #
      # The container is capped at 768M below. Without this the runtime sizes
      # the heap from GOGC alone -- goal = 2x live heap -- and production sat
      # flat at 697MiB of anon RSS, 93.6% of the cap, which is the same band
      # the kernel killed it in three times on 2026-09-01 (anon-rss 741872kB,
      # 697448kB, 694388kB). Fixing the builder pass that spiked into the
      # ceiling stopped those kills; it did not move the ceiling away from
      # where the process actually lives.
      #
      # 600MiB sits above the ~350MiB live heap that steady state implies and
      # 168MiB under the cap, which is what non-heap memory needs: goroutine
      # stacks and runtime metadata are real and do not answer to this knob.
      # Soft on purpose -- over it the collector works harder, capped by the
      # runtime at 50% CPU; over the cgroup limit the process is killed.
      GOMEMLIMIT: ${GOMEMLIMIT:-600MiB}
    volumes:
      - blobs:/data/blobs
      - ${CSX_DIST_HOST_DIR:-../dist}:/data/dist:ro
      - caddy_safe_logs:/var/log/caddy-safe:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M

  # CSX-451: the standalone compatibility Builder. Its own OS process, its
  # own PostgreSQL connection pool (CSX_BUILDER_DB_*, never CSX_DB_*), and
  # its own leader lease (builder_lease, migration 0043) so a deploy that
  # briefly overlaps this container with the one it is replacing cannot run
  # two aggregation passes at once. It depends on `server` being healthy
  # (not merely running) because `server` is what applies schema
  # migrations on boot; the Builder itself never migrates.
  #
  # `profiles: [builder]` keeps this service disabled by default: an
  # ordinary `docker compose up -d` (what deploy.ps1 runs on every server/
  # caddy deploy) never creates or starts it, and deploy.ps1 does not yet
  # build/ship a csx-builder image. #455's staged rollout is what builds
  # the image, ships it, and turns this on deliberately with `docker
  # compose --profile builder up -d builder`; until then this definition
  # documents and exercises the topology (docs/operations.md "Builder
  # runtime topology", cmd/csx-builder's own tests) without changing what
  # production actually runs.
  builder:
    profiles: ["builder"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.builder
    image: codesamplex/csx-builder:latest
    restart: unless-stopped
    environment:
      CSX_BUILDER_DSN: postgres://csx:${POSTGRES_PASSWORD:-csx-local-dev}@db:5432/csx?sslmode=disable
      CSX_BUILDER_LISTEN: ":8091"
      CSX_SNAPSHOT_INTERVAL: ${CSX_SNAPSHOT_INTERVAL:-5m}
      CSX_SNAPSHOT_PASS_TIMEOUT: ${CSX_SNAPSHOT_PASS_TIMEOUT:-}
      # The Builder's own pool ceilings. Distinct variable names from
      # CSX_DB_* on purpose (BuilderPoolPolicyFromEnv, CSX_BUILDER_DB_*):
      # writing CSX_DB_MAX_CONNS into .env must resize csx-server's pool
      # only, never this one, and vice versa.
      CSX_BUILDER_DB_POOL_GUARD: ${CSX_BUILDER_DB_POOL_GUARD:-}
      CSX_BUILDER_DB_MAX_CONNS: ${CSX_BUILDER_DB_MAX_CONNS:-}
      CSX_BUILDER_DB_PROBE_RESERVE: ${CSX_BUILDER_DB_PROBE_RESERVE:-}
      CSX_BUILDER_DB_BACKGROUND_CONNS: ${CSX_BUILDER_DB_BACKGROUND_CONNS:-}
      CSX_BUILDER_DB_READ_TIMEOUT: ${CSX_BUILDER_DB_READ_TIMEOUT:-}
      CSX_BUILDER_DB_PROBE_TIMEOUT: ${CSX_BUILDER_DB_PROBE_TIMEOUT:-}
      CSX_BUILDER_LEASE_TTL: ${CSX_BUILDER_LEASE_TTL:-}
      CSX_BUILDER_LEASE_RENEW: ${CSX_BUILDER_LEASE_RENEW:-}
      CSX_BUILDER_LEASE_RETRY: ${CSX_BUILDER_LEASE_RETRY:-}
      # A background-only, single-pipeline process on a 2GB host needs a
      # small fraction of csx-server's own 600MiB soft limit.
      GOMEMLIMIT: ${CSX_BUILDER_GOMEMLIMIT:-192MiB}
    # No published host port, matching `server`: the Builder's
    # health/ready/progress endpoints are reachable only inside the compose
    # network (`docker compose exec -T builder wget ...`), never published
    # to the host or the internet.
    expose:
      - "8091"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8091/healthz"]
      interval: 15s
      timeout: 3s
      retries: 12
      start_period: 15s
    depends_on:
      server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: csx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-csx-local-dev}
      POSTGRES_DB: csx
    # 2GB-host tuning (goal.md plan: shared_buffers 256MB, max_connections 40).
    command: >-
      postgres -c shared_buffers=256MB -c max_connections=40
      -c effective_cache_size=768MB -c maintenance_work_mem=64MB
      -c work_mem=16MB
      -c wal_compression=on
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=top
      -c pg_stat_statements.max=5000
      -c track_io_timing=on
      -c log_min_duration_statement=-1
      -c log_parameter_max_length=0
      -c log_parameter_max_length_on_error=0
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csx -d csx"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 640M

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  caddy_safe_logs:
  pgdata:
  blobs:
